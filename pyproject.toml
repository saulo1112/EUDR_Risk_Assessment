[project]
name = "eudr-risk-assessment"
version = "0.1.0"
description = "EUDR Forest Risk Assessment Tool - geospatial pipeline for deforestation-risk scoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "earthengine-api>=1.0.0",
    "geemap>=0.32.0",
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.14.0",
    "psycopg2-binary>=2.9.0",
    "folium>=0.16.0",
    "streamlit>=1.32.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",          # required by fastapi.testclient
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the repo root importable so tests can `from src... import ...` without
# an editable install (the project is an application, not a library).
pythonpath = ["."]
# Integration tests need a seeded PostGIS instance, so they are opt-in:
#   uv run pytest                  -> unit + API tests only
#   uv run pytest -m integration   -> integration tests
addopts = "-m 'not integration' --strict-markers"
markers = [
    "integration: requires a running, seeded PostGIS database",
]

[tool.ruff]
line-length = 90
target-version = "py310"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long lines inside docstrings/comments of the pipeline scripts are acceptable;
# E501 is enforced by line-length above for code.
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Legacy script preserved as a historical record of the v2 model.
"src/pipeline/legacy/*" = ["E501"]
