name: Deploy frontend to GitHub Pages

# Publishes the dashboard as a fully static site (see "Generate config.js"
# below and scripts/build_static_data.py): no backend to provision, keep
# awake, or pay for, and no cold-start latency for visitors. Server-side
# filtering and the interactive API docs remain available through the
# FastAPI + PostGIS backend in src/api/ -- set the API_BASE_URL repository
# variable to point this deploy at a live instance (Render or self-hosted).
# See README.md > Deploying for both paths.

on:
  push:
    branches: [main]
    paths:
      - src/frontend/**
      - scripts/build_static_data.py
      - data/farms.geojson
      - docker/init/20_eudr_risk.sql.gz
      - .github/workflows/deploy-pages.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static data snapshot
        # No backend required: precomputes /farms, /stats and /early-warning
        # straight from the committed pipeline outputs (stdlib only, see the
        # script's docstring for exactly what it reads).
        run: python3 scripts/build_static_data.py

      - name: Stage frontend
        run: |
          mkdir -p _site/data
          cp src/frontend/index.html src/frontend/style.css src/frontend/app.js _site/
          cp src/frontend/data/*.json _site/data/

      - name: Generate config.js
        # API_BASE_URL is a repository VARIABLE (Settings -> Secrets and
        # variables -> Actions -> Variables), not a secret: it would be a
        # public API URL and ends up in a client-side file regardless.
        #
        # Unset (the default, and the only option that needs no paid
        # hosting): the dashboard runs in static mode, reading the
        # data/*.json snapshot staged above -- no backend at all.
        # Set: the dashboard instead calls that live API on every load
        # (e.g. a self-hosted or Render-deployed instance of src/api).
        run: |
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            cat > _site/config.js <<EOF
          window.API_BASE = "${{ vars.API_BASE_URL }}";
          window.API_STATIC = false;
          EOF
          else
            cat > _site/config.js <<EOF
          window.API_STATIC = true;
          EOF
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
