# Unified EUDR Risk demo stack: PostGIS + FastAPI + static dashboard.
#
# Run from the repo root:
#   docker compose -f docker/docker-compose.yml up --build
#
# Host ports are configurable if any are already taken on your machine:
#   API_PORT=8001 FRONTEND_PORT=8081 docker compose -f docker/docker-compose.yml up
#
# Build contexts are ".." (the repo root) since this file lives in docker/.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: eudr_postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eudr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eudr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eudr_risk}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Seed scripts auto-load on FIRST start (empty volume) only. 20_* runs
      # after the image's own postgis init; the .sql.gz is decompressed by the
      # entrypoint. Self-contained: no pipeline run or Earth Engine needed.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eudr} -d ${POSTGRES_DB:-eudr_risk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: src/api/Dockerfile
    container_name: eudr_api
    environment:
      # Point at the db SERVICE name on the compose network, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-eudr}:${POSTGRES_PASSWORD:-eudr_dev_password}@db:5432/${POSTGRES_DB:-eudr_risk}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: src/frontend/Dockerfile
    container_name: eudr_frontend
    environment:
      # The browser runs on the HOST, so it reaches the API through the host
      # port, not the internal service name.
      API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
